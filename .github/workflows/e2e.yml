name: E2E tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  BACKSTAGE_REPOSITORY: christoph-jerolimov/backstage-history

jobs:
  versions:
    name: Resolve Backstage versions
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - name: Resolve refs
        id: refs
        # The main branch plus the latest patch release of the 20 most recent
        # Backstage release lines (e.g. 1.55.0, 1.54.0, ...).
        run: |
          refs=$(git ls-remote --tags --refs "https://github.com/${BACKSTAGE_REPOSITORY}.git" \
            | awk -F/ '{print $3}' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V -r \
            | awk -F. '!seen[$1"."$2]++' \
            | head -n 20 \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | ["main"] + .')
          echo "Testing against: $refs"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (backstage-history ${{ matrix.ref }})
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.versions.outputs.refs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: backstage-playwright-lib

      - name: Checkout Backstage app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKSTAGE_REPOSITORY }}
          ref: ${{ matrix.ref }}
          path: backstage-history

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backstage app dependencies
        working-directory: backstage-history
        run: yarn install --immutable

      - name: Configure Backstage app
        # Writes app-config.local.yaml (and, for the old frontend system,
        # patches App.tsx) to enable translations for en and de.
        run: node backstage-playwright-lib/scripts/setup-backstage.mjs backstage-history

      - name: Install Playwright project dependencies
        working-directory: backstage-playwright-lib
        run: npm ci

      - name: Install Playwright browsers
        working-directory: backstage-playwright-lib
        run: npx playwright install --with-deps chromium

      - name: Start Backstage app
        working-directory: backstage-history
        # Up to Backstage 1.37, `yarn start` only starts the frontend and the
        # backend is started with `yarn start-backend`; `yarn dev` starts both.
        run: |
          if node -e "process.exit(require('./package.json').scripts['start-backend'] ? 0 : 1)"; then
            nohup yarn dev > ../backstage.log 2>&1 &
          else
            nohup yarn start > ../backstage.log 2>&1 &
          fi

      - name: Wait for Backstage app
        run: |
          for i in $(seq 1 180); do
            if curl -sf http://localhost:3000 > /dev/null && curl -s http://localhost:7007 > /dev/null; then
              echo "Backstage is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backstage did not start in time"
          cat backstage.log
          exit 1

      - name: Run Playwright tests
        working-directory: backstage-playwright-lib
        env:
          PLAYWRIGHT_URL: http://localhost:3000
          BACKSTAGE_VERSION: ${{ matrix.ref }}
        run: npx playwright test

      - name: Print Backstage log
        if: always()
        run: cat backstage.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.ref }}
          path: |
            backstage-playwright-lib/playwright-report/
            backstage-playwright-lib/test-results/
            backstage-playwright-lib/test-results.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.ref }}
          path: backstage-playwright-lib/screenshots/
          retention-days: 7
          if-no-files-found: ignore

  screenshots:
    name: Collect screenshots
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Merge screenshots of all versions into one artifact
        uses: actions/upload-artifact/merge@v4
        with:
          name: screenshots
          pattern: screenshots-*
          retention-days: 7

  pages:
    name: Publish to GitHub Pages
    needs: [versions, e2e]
    # Publish only from the default branch, also when some versions failed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Playwright reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-report-*
          path: artifacts/reports

      - name: Download screenshots
        uses: actions/download-artifact@v4
        with:
          pattern: screenshots-*
          path: artifacts/screenshots
          merge-multiple: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Prepare site data
        working-directory: site
        env:
          REFS: ${{ needs.versions.outputs.refs }}
        run: node scripts/prepare.mjs ../artifacts

      - name: Build site
        working-directory: site
        env:
          ASTRO_SITE: ${{ steps.pages.outputs.origin }}
          ASTRO_BASE: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
